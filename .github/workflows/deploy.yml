name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds on every PR and push, so a broken firmware build shows up before merge.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # version.py needs commit date

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', '.github/workflows/deploy.yml') }}

      # Pinned so a new PlatformIO/esptool release can't silently change the build.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19 esptool==5.7.0

      - name: Build firmware
        run: pio run

      - name: Merge flash image into web/
        run: |
          python -m esptool --chip esp32 merge-bin \
            -o web/strumento-m5core2.bin \
            --flash-mode dio --flash-size 16MB \
            0x1000  .pio/build/m5core2/bootloader.bin \
            0x8000  .pio/build/m5core2/partitions.bin \
            0x10000 .pio/build/m5core2/firmware.bin
          ls -lh web/strumento-m5core2.bin

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
